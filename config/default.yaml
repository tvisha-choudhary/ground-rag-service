corpus:
  n_services: 120
  sections_per_doc: 6
  hard_negative_rate: 0.35
  n_answerable: 300
  n_unanswerable: 100
  seed: 42
  output_dir: data/generated

chunking:
  fixed_size_words: 120
  fixed_overlap_words: 30

retrieval:
  top_k: 5
  # Product constraint on serving-config selection: a citation the
  # reviewer must scan more than this many sections to verify fails
  # the verifiability bar, whatever its accuracy.
  max_sections_per_citation: 4
  lsa_dims: 256
  rrf_k: 60

answer:
  abstain_below: 0.5
  support_overlap_threshold: 0.5

artifacts_dir: artifacts
